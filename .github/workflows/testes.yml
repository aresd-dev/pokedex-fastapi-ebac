name: Testes da Pokédex
on: [push, pull_request]
permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-test.txt
      - name: Testar modelos e endpoints
        run: python -m pytest -q
      - name: Subir API e PostgreSQL
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Cadastrar no PostgreSQL e confirmar conflito de nome
        run: |
          body='{"nome":"Pikachu","tipo":"Elétrico","nivel":15,"ataque":55}'
          url=http://localhost:8000/pokemons
          test "$(curl -sS -o /tmp/pokemon.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$url")" = 201
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$url")" = 409
      - name: Recriar os containers e conferir os dados persistidos
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          url=http://localhost:8000/pokemons
          id=$(jq -er '.id' /tmp/pokemon.json)
          curl -fsS "$url/$id" | jq -e '.nome == "Pikachu" and .ataque == 55'
          curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"nome":"Raichu","tipo":"Elétrico","nivel":20,"ataque":90}' "$url/$id" | jq -e '.nome == "Raichu"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$url/$id")" = 204
          curl -fsS "$url" | jq -e '. == []'
      - name: Exibir logs se houver falha
        if: failure()
        run: docker compose logs --no-color
